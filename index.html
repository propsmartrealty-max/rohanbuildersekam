      <header style="padding: 24px 16px; background-color: #FAF8F5; border-bottom: 1px solid #E5E0D8; text-align: center;">
        <p style="font-size: 11px; text-transform: uppercase; letter-spacing: 2px; color: #78350F; font-weight: bold; margin: 0 0 8px 0;">Project Showcase • Rohan Builders &amp; Ar. Sanjay Mohe</p>
        <h1 style="font-family: Cormorant Garamond, serif; font-size: 36px; margin: 0; color: #1C1917; font-weight: 700;">Rohan Ekam Balewadi, Pune</h1>
        <p style="font-size: 15px; color: #44403C; margin: 8px 0 0 0;">Luxury 2, 3 &amp; 4 BHK Riverfront Residences Starting ₹1.45 Cr* • MahaRERA: P52100052298</p>
      </header>

      <main role="main" style="max-width: 1200px; margin: 0 auto; padding: 40px 16px; font-family: Plus Jakarta Sans, sans-serif; color: #292524; line-height: 1.7;">
        <section style="margin-bottom: 40px;">
          <h2 style="font-family: Cormorant Garamond, serif; font-size: 28px; color: #1C1917; margin-bottom: 12px;">Where the River Meets the Sky: 13-Acre Riverfront Enclave in Balewadi</h2>
          <p>Spread across a pristine <strong>13-acre riverside parcel along the Mula River in Balewadi, Pune (411045)</strong>, <strong>Rohan Ekam</strong> is a residential marvel conceptualized by <strong>Rohan Builders (India) Pvt. Ltd.</strong> and renowned master architect <strong>Ar. Sanjay Mohe</strong> (Mindspace Architects). Rohan Ekam features India's first <strong>&quot;Ground Floor in the Sky&quot;</strong> at Level 14—a monumental elevated community expanse with sky bridges, cascading sloping lawns, co-working lounges, and over 50 resort-grade amenities.</p>
        </section>

        <section style="margin-bottom: 40px;">
          <h2 style="font-family: Cormorant Garamond, serif; font-size: 28px; color: #1C1917; margin-bottom: 12px;">Residences, Floor Plans &amp; Pricing (2, 3 &amp; 4 BHK)</h2>
          <p>Every home at Rohan Ekam is designed with the acclaimed <strong>Rohan PLUS Homes</strong> philosophy, ensuring zero corridor wastage, wind-tunnel cross ventilation, expansive natural lighting, and total privacy.</p>
          <table style="width: 100%; border-collapse: collapse; margin-top: 16px; margin-bottom: 20px; font-size: 13px;">

                <th style="padding: 10px; border-bottom: 1px solid #D6D3CD;">Key Feature</th>

            </thead>
            <tbody>

                <td style="padding: 10px; border-bottom: 1px solid #E5E0D8;">850 – 950 Sq. Ft.</td>
                <td style="padding: 10px; border-bottom: 1px solid #E5E0D8;">₹1.45 Cr*</td>

                <td style="padding: 10px; border-bottom: 1px solid #E5E0D8;">1,150 – 1,280 Sq. Ft.</td>

                <td style="padding: 10px; border-bottom: 1px solid #E5E0D8;"><strong><a href="/3-bhk-flats-in-balewadi" style="color: #065F46;">3 BHK Grand (Type 2)</a></strong></td>

          </table>
          <p style="font-size: 12px; color: #78716C;">*Note: Government taxes (GST 5%), Maharashtra stamp duty (7%), registration, and society maintenance charges extra. Detailed breakdowns available on our <a href="/price-and-cost-sheet" style="color: #065F46; font-weight: 600;">Price &amp; Cost Sheet</a>.</p>
        </section>

        <section style="margin-bottom: 40px;">
          <h2 style="font-family: Cormorant Garamond, serif; font-size: 28px; color: #1C1917; margin-bottom: 12px;">The Ground Floor in the Sky at Level 14 &amp; 50+ Project Amenities</h2>
          <p>Rohan Ekam introduces India's first continuous <strong>Ground Floor in the Sky at Level 14</strong>, linking towers horizontally through landscaped bridges, sloping green lawns, open-air amphitheatres, yoga decks, co-working lounges, and observation terraces suspended 140 feet above the ground.</p>
          <ul style="list-style-type: square; margin-left: 20px;">
            <li><strong>Riverfront &amp; Nature:</strong> 1.2 km Mula Riverfront boardwalk, reflexology pathways, sensory gardens, bird-watching pavilions.</li>
            <li><strong>Sports &amp; Fitness:</strong> 50m Olympic-length swimming pool, indoor squash court, multi-sport turf, gymnasium, jogging circuit.</li>
            <li><strong>Community &amp; Leisure:</strong> Grand clubhouse, banquet hall, private screening theatre, children's adventure play haven, senior citizen plaza.</li>
            <li><strong>Smart Technology &amp; Security:</strong> 5-tier gated access security, RFID vehicular access, EV charging infrastructure, rainwater harvesting.</li>
          </ul>
        </section>

        <section style="margin-bottom: 40px;">
          <h2 style="font-family: Cormorant Garamond, serif; font-size: 28px; color: #1C1917; margin-bottom: 12px;">Strategic Location &amp; Micro-Market Connectivity (Balewadi, Pune)</h2>
          <p>Located on the Mula Riverfront directly behind Balewadi High Street, Rohan Ekam provides unmatched accessibility across Pune's prime western corridor:</p>
          <ul style="list-style-type: square; margin-left: 20px;">
            <li><strong>Balewadi High Street:</strong> 5 minutes (Direct arterial access to gourmet dining, luxury retail &amp; cafes)</li>
            <li><strong>Baner Road &amp; Westend Mall:</strong> 7 minutes (Seamless connectivity to Aundh &amp; western Pune)</li>
            <li><strong>Hinjawadi IT Park (Phase 1 &amp; Phase 2):</strong> 12–15 minutes (Fast riverfront bypass avoiding Baner bottlenecks)</li>
            <li><strong>Mumbai-Pune Expressway:</strong> 5 minutes (Dehu Road bypass / Wakad flyover junction)</li>
            <li><strong>Upcoming Balewadi Metro Station (Line 3):</strong> Rapid connectivity between Hinjawadi and Shivajinagar</li>
            <li><strong>Top Healthcare &amp; Education:</strong> Jupiter Hospital, Manipal Hospital, The Orchid School, Bharati Vidyapeeth</li>
          </ul>
          <p style="margin-top: 10px;"><a href="/location-balewadi-high-street" style="color: #065F46; font-weight: 600;">View Complete Commute Guide &amp; Location Map &rarr;</a></p>
        </section>

        <!-- Baner-Balewadi Luxury Real Estate Market Section -->
        <section style="margin-bottom: 40px;">
          <h2 style="font-family: Cormorant Garamond, serif; font-size: 28px; color: #1C1917; margin-bottom: 12px;">Baner &amp; Balewadi Luxury Real Estate: Market Dynamics &amp; Micro-Locations</h2>
          <p>The <strong>Baner–Balewadi corridor</strong> has established itself as West Pune's most coveted luxury real estate ecosystem. Combining high-yield commercial hubs like <strong>Balewadi High Street</strong> and the <strong>Cummins India Campus</strong> with serene natural riverfront topography along the Mula River, property buyers enjoy capital appreciation compounding at <strong>8.5% to 11.2% CAGR</strong> alongside <strong>3.5% to 4.2% rental yields</strong>.</p>
          <p>Key luxury micro-markets surrounding Rohan Ekam include:</p>
          <ul style="list-style-type: square; margin-left: 20px;">
            <li><strong>Luxury flats in Baner:</strong> High-end residential enclaves along Pancard Club Road, Baner Hills, and Baner-Pashan Link Road with quick connectivity to Aundh, Pashan, and Westend Mall.</li>
            <li><strong>Luxury flats in Balewadi:</strong> Riverfront luxury developments near Balewadi High Street, Balewadi Sports Complex, and Cummins India with upcoming Pune Metro Line 3 access.</li>
            <li><strong>Hinjawadi IT Corridor:</strong> Premier executive housing corridor for IT leaders working in Infosys, TCS, Wipro, and Barclays seeking tranquil riverfront homes within 12 minutes of Phase 1.</li>
            <li><strong>Mahalunge &amp; Sus Road:</strong> Expanding high-tech residential belts connecting western Pune to the Mumbai-Bangalore Highway.</li>
          </ul>
